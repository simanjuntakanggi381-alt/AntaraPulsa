services:
  postgres:
    image: postgres:16-alpine
    container_name: antarapulsa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - antarapulsa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    container_name: antarapulsa-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      AUTH_SECURE_COOKIES: ${AUTH_SECURE_COOKIES:-true}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
      PULSA24JAM_H2HR_ENABLED: ${PULSA24JAM_H2HR_ENABLED:-false}
      PULSA24JAM_H2HR_URL: ${PULSA24JAM_H2HR_URL:-https://api.pulsa24jam.net/v2/trx}
      PULSA24JAM_H2HR_API_KEY: ${PULSA24JAM_H2HR_API_KEY:-}
      PULSA24JAM_H2HR_PIN: ${PULSA24JAM_H2HR_PIN:-}
      PULSA24JAM_H2HR_CALLBACK_TOKEN: ${PULSA24JAM_H2HR_CALLBACK_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"

  frontend:
    build:
      context: ../frontend
    container_name: antarapulsa-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5174:80"

volumes:
  antarapulsa_postgres_data:
